<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Buku Kas Pribadi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..800&family=JetBrains+Mono:wght@400;500&family=Libre+Franklin:wght@400;500;600;700&display=swap">
<style>
/* Grid & tipografi: 12 kolom, ubin bento berbeda ukuran dan nada, angka raksasa, label mikro monospace. Ilustrasi dan ikon bereaksi pada hover dan sentuhan. */
:root{
  --bg:#F2F2F2; --surface:#FFFFFF; --surface2:#E8E8E8; --ink:#333333; --muted:#666666; --line:#DADADA;
  --accent:#D7EBFF; --accent-ink:#333333; --accent-soft:#EAF4FF; --accent-fg:#2F6FB0;
  --in:#2B7A4B; --in-soft:#DFF2E6; --out:#B3382C; --out-soft:#FADFDA; --warn:#85601A; --warn-soft:#FBF1CF;
  --c1:#5B9BD5; --c2:#E8956A; --c3:#5FB58A; --c4:#9B7FD1; --c5:#D9B24A; --c6:#D9709A; --c7:#4FB3B8; --c8:#9AA0A6; --inv-bg:#333333; --inv-fg:#F2F2F2;
  --f-display:'Archivo','Libre Franklin',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-body:'Libre Franklin',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1128; --surface:#1C2541; --surface2:#26325A; --ink:#F4F5F7; --muted:#9FABC8; --line:#303D69;
  --accent:#64DFDF; --accent-ink:#0A1128; --accent-soft:#12384F; --accent-fg:#64DFDF;
  --in:#5FE3A1; --in-soft:#133A3A; --out:#FF8F8F; --out-soft:#46243A; --warn:#F2C75C; --warn-soft:#3B3A2C;
  --c1:#64DFDF; --c2:#FF9F7A; --c3:#5FE3A1; --c4:#A78BFA; --c5:#F2C75C; --c6:#F58BB8; --c7:#5AB8FF; --c8:#9FABC8; --inv-bg:#26325A; --inv-fg:#F4F5F7;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1128; --surface:#1C2541; --surface2:#26325A; --ink:#F4F5F7; --muted:#9FABC8; --line:#303D69;
  --accent:#64DFDF; --accent-ink:#0A1128; --accent-soft:#12384F; --accent-fg:#64DFDF;
  --in:#5FE3A1; --in-soft:#133A3A; --out:#FF8F8F; --out-soft:#46243A; --warn:#F2C75C; --warn-soft:#3B3A2C;
  --c1:#64DFDF; --c2:#FF9F7A; --c3:#5FE3A1; --c4:#A78BFA; --c5:#F2C75C; --c6:#F58BB8; --c7:#5AB8FF; --c8:#9FABC8; --inv-bg:#26325A; --inv-fg:#F4F5F7;
  color-scheme:dark}
:root[data-mode="light"]{
  --bg:#F2F2F2; --surface:#FFFFFF; --surface2:#E8E8E8; --ink:#333333; --muted:#666666; --line:#DADADA;
  --accent:#D7EBFF; --accent-ink:#333333; --accent-soft:#EAF4FF; --accent-fg:#2F6FB0;
  --in:#2B7A4B; --in-soft:#DFF2E6; --out:#B3382C; --out-soft:#FADFDA; --warn:#85601A; --warn-soft:#FBF1CF;
  --c1:#5B9BD5; --c2:#E8956A; --c3:#5FB58A; --c4:#9B7FD1; --c5:#D9B24A; --c6:#D9709A; --c7:#4FB3B8; --c8:#9AA0A6; --inv-bg:#333333; --inv-fg:#F2F2F2;
  color-scheme:light}
:root[data-mode="dark"]{
  --bg:#0A1128; --surface:#1C2541; --surface2:#26325A; --ink:#F4F5F7; --muted:#9FABC8; --line:#303D69;
  --accent:#64DFDF; --accent-ink:#0A1128; --accent-soft:#12384F; --accent-fg:#64DFDF;
  --in:#5FE3A1; --in-soft:#133A3A; --out:#FF8F8F; --out-soft:#46243A; --warn:#F2C75C; --warn-soft:#3B3A2C;
  --c1:#64DFDF; --c2:#FF9F7A; --c3:#5FE3A1; --c4:#A78BFA; --c5:#F2C75C; --c6:#F58BB8; --c7:#5AB8FF; --c8:#9FABC8; --inv-bg:#26325A; --inv-fg:#F4F5F7;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-synthesis:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums lining-nums;
  padding-block:0 108px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(40px,11vw,76px);font-weight:800;font-stretch:62%;letter-spacing:-.005em;text-transform:uppercase;line-height:.92}
h1 .dot{color:var(--accent-fg)}
h2{font-size:16px;font-weight:700;font-stretch:90%;letter-spacing:.005em}
h3{font-size:17px;font-weight:700;font-stretch:90%}
.num{font-weight:500}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.up,.eyebrow{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:500;color:var(--muted)}
.in{color:var(--in)} .out{color:var(--out)} .warn{color:var(--warn)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}

/* header */
.top .topin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:14px 0}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-stretch:75%;font-size:21px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.mark{display:inline-grid;place-items:center;height:30px;min-width:34px;padding:0 6px;background:var(--ink);color:var(--bg);border-radius:9px;font-size:14px;letter-spacing:0;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.brand:hover .mark{transform:rotate(-10deg) scale(1.08)}
.tabs{display:none;gap:2px;flex:1;min-width:0;overflow-x:auto;justify-content:safe center;scrollbar-width:none}
.tabs button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:8px 11px;font-weight:600;font-size:13.5px;color:var(--muted);border-radius:999px;white-space:nowrap;transition:background .2s,color .2s}
.tabs button svg.ic{width:18px;height:18px}
.tabs button:hover{color:var(--ink);background:var(--surface2)}
.tabs button:hover svg.ic{transform:rotate(-12deg) scale(1.2)}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.topr{display:flex;align-items:center;gap:12px;margin-left:auto}
.topr .btn{display:none}
.sync{font-family:var(--f-mono);font-size:0;color:var(--muted);display:inline-flex;align-items:center;gap:6px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.sync[data-s="ok"]::before{background:var(--in)} .sync[data-s="busy"]::before{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

.main{max-width:1180px;margin:0 auto;padding-top:10px;min-width:0}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 20px;flex-wrap:wrap;margin-bottom:18px}
.pagehead .ttl{display:flex;align-items:flex-end;gap:14px;min-width:0}
.pagehead .ttl>div{min-width:0}
.pagehead .stk{width:70px;height:auto;flex:0 0 auto;color:var(--ink)}
.pagehead .eyebrow{margin-bottom:8px}
.pagehead .acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* navigasi bawah (HP) */
.bottom{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--inv-bg);color:var(--inv-fg);border-radius:22px;display:flex;padding:6px;box-shadow:0 10px 30px rgba(8,14,24,.35)}
.bottom button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;font-size:11px;font-weight:600;color:color-mix(in srgb,var(--inv-fg) 62%,transparent);padding:8px 0 6px;border-radius:16px;transition:background .2s,color .2s}
.bottom button:active svg.ic{transform:scale(.85)}
.bottom button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.bottom button[aria-current="page"] svg.ic{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.6) rotate(-14deg)}100%{transform:none}}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:13px 20px;font-weight:700;box-shadow:0 8px 22px rgba(8,14,24,.3);z-index:25;display:inline-flex;gap:7px;align-items:center;transition:transform .2s}
.fab:active{transform:scale(.94)}
@media (min-width:1420px){.sync{font-size:11px}}
@media (min-width:900px){
  body{padding-block:0 64px}
  .tabs{display:flex}
  .topr .btn{display:inline-flex}
  .bottom,.fab{display:none}
}

/* grid bento */
.stack{display:flex;flex-direction:column;gap:12px}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;grid-auto-flow:row dense}
.bento>*{grid-column:span 12}
@media (min-width:640px){.bento>.s4{grid-column:span 6}.bento>.s8{grid-column:span 12}}
@media (min-width:1000px){.bento>.s4{grid-column:span 4}.bento>.s8{grid-column:span 8}}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.grid>*{min-width:0}

/* ubin */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;min-width:0;overflow:hidden;isolation:isolate;transition:transform .3s cubic-bezier(.34,1.56,.64,1),border-color .2s,box-shadow .3s}
.card::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),var(--accent-soft),transparent 70%)}
.card.link{cursor:pointer;display:flex;flex-direction:column}
.deco{margin-top:auto;padding-top:14px;display:flex;justify-content:flex-end}
.deco .ill{width:84px;color:var(--ink);opacity:.9}
.card.link:hover{transform:translateY(-3px);border-color:var(--ink);box-shadow:0 14px 30px -14px rgba(8,14,24,.35)}
.card.link:hover::before{opacity:1}
.card.link:active{transform:translateY(-1px) scale(.992)}
.card h2,.card h3{margin-bottom:0}
.card.obj{border-radius:20px;padding:18px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hd h2{flex:1;min-width:0}
.tic{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--accent-soft);color:var(--accent-fg);flex:0 0 auto;transition:background .25s,color .25s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.card:hover>.hd .tic,.qa:hover .tic{background:var(--accent);color:var(--accent-ink);transform:rotate(-8deg) scale(1.08)}
.card:hover>.hd .tic svg.ic,.qa:hover .tic svg.ic{transform:scale(1.1)}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sechead h2,.sechead h3{margin:0}

/* ubin kekayaan bersih: solid aksen, angka raksasa */
.nw{display:flex;flex-direction:column;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding:24px 24px 20px}
.nw::before{background:radial-gradient(320px circle at var(--mx,70%) var(--my,0%),rgba(255,255,255,.16),transparent 70%)}
.nw:hover::before{opacity:1}
.nw .up{color:inherit;opacity:.75}
.nw .nwv{font-family:var(--f-display);font-stretch:100%;font-weight:800;font-size:clamp(30px,8vw,92px);letter-spacing:-.035em;line-height:.95;margin:10px 0 22px;word-break:break-word;max-width:calc(100% - 96px)}
.nw>.ill{position:absolute;right:14px;top:12px;width:104px;height:auto;color:var(--accent-ink);z-index:0}
.nw .ill .cn{fill:color-mix(in srgb,currentColor 16%,transparent)}
.sky{margin-top:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sk{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:0;background:color-mix(in srgb,var(--accent-ink) 12%,transparent);border-radius:16px;padding:10px 12px 11px;color:inherit;min-width:0;transition:background .2s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.sk:hover{background:color-mix(in srgb,var(--accent-ink) 22%,transparent);transform:translateY(-3px)}
.skb{display:block;height:34px;width:100%;position:relative}
.skb i{position:absolute;left:0;bottom:0;width:100%;height:var(--h);min-height:6px;border-radius:8px;background:currentColor;opacity:.45;transform-origin:bottom;animation:grow .8s var(--d,0ms) cubic-bezier(.22,1,.36,1) both;transition:opacity .2s}
.sk:hover .skb i{opacity:.9}
@keyframes grow{from{transform:scaleY(.05);opacity:0}}
.skl{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;opacity:.8}
.sk b{font-weight:600;font-size:13px;overflow-wrap:anywhere;line-height:1.2}
@media (max-width:640px){.nw>.ill{width:62px}.nw .nwv{max-width:none;margin-top:22px}}
@media (max-width:520px){.sky{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* arus kas */
.donutwrap{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.donut{width:104px;height:104px;flex:0 0 auto;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:12}
.donut .tr{stroke:var(--surface2)}
.donut .ar{stroke:var(--accent-fg);stroke-linecap:round;transition:stroke-dasharray .9s cubic-bezier(.22,1,.36,1)}
.donut.near .ar{stroke:var(--warn)} .donut.over .ar{stroke:var(--out)}
.dpct{font-family:var(--f-display);font-weight:800;font-size:58px;line-height:.9;letter-spacing:-.04em}
.dpct small{font-size:24px;font-weight:700;margin-left:2px}
.krow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.krow .v{font-size:17px;font-weight:600}

/* jalan pintas */
.tone-ink{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.tone-ink .up,.tone-ink .muted{color:color-mix(in srgb,var(--inv-fg) 65%,transparent)}
.tone-ink .tic{background:color-mix(in srgb,var(--inv-fg) 14%,transparent);color:var(--inv-fg)}
.tone-ink h2{color:var(--inv-fg)}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:12px;text-align:left;border:0;border-radius:18px;padding:12px 12px 14px;background:color-mix(in srgb,var(--inv-fg) 11%,transparent);color:var(--inv-fg);font-weight:600;font-size:14px;transition:background .2s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.qa:hover{background:color-mix(in srgb,var(--inv-fg) 20%,transparent);transform:translateY(-3px)}
.qa:active{transform:scale(.95)}
.tone-ink .qa:hover .tic{background:var(--accent);color:var(--accent-ink)}

/* ilustrasi */
.ill{width:110px;height:auto;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.ill .sh{fill:currentColor;stroke:none;opacity:.14}
.ill .cn{fill:var(--accent-soft);transition:transform .45s cubic-bezier(.34,1.56,.64,1);transform-box:fill-box}
.ill .cd{fill:var(--accent);stroke:currentColor;transition:transform .45s cubic-bezier(.34,1.56,.64,1);transform-box:fill-box}
.ill .cd-l{stroke:var(--accent-ink)}
.ill .sl{fill:var(--accent);transition:transform .4s cubic-bezier(.34,1.56,.64,1);transform-box:fill-box}
.ill .bb{fill:var(--accent);transform-box:fill-box;transform-origin:bottom;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.ill-wallet rect:not(.cd){fill:var(--accent-soft)}
.ill-pie circle{fill:var(--accent-soft)}
.nw .ill .sh{opacity:.2}
.card:hover .ill .n3,.stk:hover .n3{transform:translateY(-9px)}
.card:hover .ill .n2,.stk:hover .n2{transform:translateY(-5px)}
.card:hover .ill .n1,.stk:hover .n1{transform:translateY(-2px)}
.card:hover .ill .cd,.stk:hover .cd{transform:translate(4px,-8px) rotate(6deg)}
.card:hover .ill .sl,.stk:hover .sl{transform:translate(5px,-5px)}
.card:hover .ill .b1,.stk:hover .b1{transform:scaleY(1.18)}
.card:hover .ill .b2,.stk:hover .b2{transform:scaleY(.88)}
.card:hover .ill .b3,.stk:hover .b3{transform:scaleY(1.08)}
.ill .bb{animation:grow .8s cubic-bezier(.22,1,.36,1) both}
.ill .b2{animation-delay:.08s}.ill .b3{animation-delay:.16s}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 0 4px;color:var(--muted);font-size:14px}
.empty .ill{width:92px;color:var(--ink)}

/* tombol */
.btn{border:1px solid var(--ink);background:transparent;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:background .2s,transform .25s cubic-bezier(.34,1.56,.64,1),color .2s}
.btn:hover{background:var(--surface2);transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1);background:var(--accent)}
.btn.danger{color:var(--out);border-color:var(--out)}
.btn.danger:hover{background:var(--out-soft)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default;filter:none;transform:none}
.btn:disabled:hover{background:transparent;transform:none}
.linkbtn{border:0;background:var(--surface2);color:var(--ink);padding:4px 11px;font-size:12px;font-weight:600;border-radius:999px;transition:background .2s,color .2s}
.linkbtn:hover{background:var(--ink);color:var(--bg)}
.linkbtn.d{color:var(--out);background:var(--out-soft)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.mnav{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.mnav button{border:0;background:none;width:34px;height:34px;border-radius:50%;font-size:19px;line-height:1;color:var(--ink);transition:background .2s,transform .25s cubic-bezier(.34,1.56,.64,1)}
.mnav button:hover{background:var(--surface2)}
.mnav button:active{transform:scale(.85)}
.mnav strong{min-width:124px;text-align:center;font-size:14px;font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.pill{display:inline-block;font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;color:var(--muted);background:var(--surface2);white-space:nowrap}
.pill.in{color:var(--in);background:var(--in-soft)} .pill.out{color:var(--out);background:var(--out-soft)} .pill.warn{color:var(--warn);background:var(--warn-soft)} .pill.acc{color:var(--accent-fg);background:var(--accent-soft)}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px dashed var(--line);min-width:0}
.item:first-child{border-top:0}
.item .l{min-width:0;display:flex;flex-direction:column;gap:2px}
.item .l .t{font-weight:600;overflow-wrap:anywhere}
.item .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:0 0 auto}
.item .r .num{font-weight:600}
.dayhead{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:6px 12px;margin:14px 0 2px;background:var(--surface2);border-radius:999px;display:inline-block}
.daygroup:first-child .dayhead{margin-top:0}

.bar{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden}

function gdriveTokenValid(){return gdriveToken&&gdriveNow()<gdriveTokenExpiry-60000}
async function gdriveGetToken(silent){
  if(gdriveTokenValid())return gdriveToken;
  var cfg=getGDriveConfig();
  if(!cfg||!cfg.clientId)throw {code:'no_config',message:'Google Drive belum dikonfigurasi. Buka Pengaturan > Cadangan & pemulihan > Konfigurasi Google Drive.'};
  await loadGIS();
  return new Promise(function(resolve,reject){
    google.accounts.oauth2.initTokenClient({
      client_id:cfg.clientId,
      scope:GDRIVE_SCOPE,
      callback:function(resp){
        if(resp&&resp.access_token){
          gdriveToken=resp.access_token;
          gdriveTokenExpiry=gdriveNow()+(resp.expires_in||3600)*1000;
          resolve(gdriveToken);
        }else reject({code:'auth_failed',message:resp&&resp.error?resp.error:'Gagal mendapatkan token akses'});
      }
    }).requestAccessToken({prompt:silent?'none':'consent'});
  });
}
function gdriveAuthHeaders(){
  return {'Authorization':'Bearer '+gdriveToken,'Content-Type':'application/json'}
}
async function gdriveRequest(url,opts){
  var token=await gdriveGetToken(true);
  var headers=gdriveAuthHeaders();
  if(opts&&opts.headers)Object.assign(headers,opts.headers);
  var r=await fetch(url,{method:opts&&opts.method||'GET',headers:headers,body:opts&&opts.body});
  if(r.status===401){
    gdriveToken=null;gdriveTokenExpiry=0;
    token=await gdriveGetToken(false);
    headers=gdriveAuthHeaders();
    if(opts&&opts.headers)Object.assign(headers,opts.headers);
    r=await fetch(url,{method:opts&&opts.method||'GET',headers:headers,body:opts&&opts.body});
  }
  if(!r.ok){
    var txt=await r.text();
    throw {code:r.status,message:txt||'Google Drive API error: '+r.status};
  }
  return r.json();
}
async function gdriveListBackups(){
  var q="name contains '"+GDRIVE_FILE_PREFIX+"' and mimeType='application/json' and trashed=false";
  var url='https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&orderBy=modifiedTime desc&fields=files(id,name,modifiedTime,size)&pageSize=20';
  return (await gdriveRequest(url)).files||[];
}
async function gdriveCreateBackup(json,name){
  var metadata={name:name,parents:['appDataFolder'],mimeType:'application/json'};
  var form=new FormData();
  form.append('metadata',new Blob([JSON.stringify(metadata)],{type:'application/json'}));
  form.append('file',new Blob([json],{type:'application/json'}));
  var token=await gdriveGetToken(false);
  var r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{
    method:'POST',headers:{'Authorization':'Bearer '+token},body:form
  });
  if(!r.ok)throw {code:r.status,message:await r.text()};
  return r.json();
}
async function gdriveReadBackup(fileId){
  var url='https://www.googleapis.com/drive/v3/files/'+fileId+'?alt=media';
  var token=await gdriveGetToken(true);
  var r=await fetch(url,{headers:{'Authorization':'Bearer '+token}});
  if(r.status===401){
    gdriveToken=null;gdriveTokenExpiry=0;
    token=await gdriveGetToken(false);
    r=await fetch(url,{headers:{'Authorization':'Bearer '+token}});
  }
  if(!r.ok)throw {code:r.status,message:await r.text()};
  return r.text();
}
async function gdriveDeleteBackup(fileId){
  var url='https://www.googleapis.com/drive/v3/files/'+fileId;
  await gdriveRequest(url,{method:'DELETE'});
}

function stateFromDocs(docs){
  var o={updatedAt:0,tx:[]};var m=docs.meta||{};
  o.updatedAt=m.updatedAt;o.demo=m.demo;o.budgetStart=m.budgetStart;o.budgetEnd=m.budgetEnd;o.budgetFrom=m.budgetFrom;o.budgetTo=m.budgetTo;o.prefs=m.prefs;o.driveLast=m.driveLast;o.wallets=m.wallets;o.cats=m.cats;o.budgets=m.budgets;

function save(){
  S.updatedAt=Date.now();writeLocal();
  if(store.col){setSync('busy','Menyimpan…');clearTimeout(store.timer);store.timer=setTimeout(pushSync,900)}
  else if(!sbReady())setSync('local','Tersimpan di perangkat ini');
  sbSchedulePush();
}
async function pushSync(){
  if(!store.col)return;
  if(store.busy){store.dirty=true;return}
  store.busy=true;
  try{
    var next=docsFromState(S),keys=Object.keys(next);
    for(var i=0;i<keys.length;i++){var k=keys[i],str=JSON.stringify(next[k]);if(store.last[k]!==str){await store.col.doc(k).set(next[k]);store.last[k]=str}}
    var old=Object.keys(store.last);
    for(var j=0;j<old.length;j++){if(!(old[j] in next)){await store.col.doc(old[j]).delete();delete store.last[old[j]]}}
    setSync('ok','Tersimpan di akun Anda');
  }catch(e){setSync('local','Tersimpan di perangkat ini (sinkron gagal)')}
  store.busy=false;
  if(store.dirty){store.dirty=false;pushSync()}
}
async function initDb(){
  try{
    var cl=window.claude;if(!cl||!cl.use){setSync('local','Tersimpan di perangkat ini');return}
    var db=await cl.use('db'),user=await cl.use('user');
    if(!db||!user){setSync('local','Tersimpan di perangkat ini');return}
    var id=await user.id();if(!id){setSync('local','Tersimpan di perangkat ini');return}
    var col=db.collection('data/users/'+id);
    var snap=await col.get(),docs={};
    snap.docs.forEach(function(d){docs[d.id]=d.data()});
    store.last={};Object.keys(docs).forEach(function(k){store.last[k]=JSON.stringify(docs[k])});
    store.col=col;
    if(docs.meta){
      var remote=stateFromDocs(docs);
      if(remote.updatedAt>=S.updatedAt){S=remote;writeLocal();applyTheme();ui.bm=curBudKey();render()}
      else pushSync();
    }else if(S.updatedAt>0)pushSync();
    setSync('ok','Tersimpan di akun Anda');
  }catch(e){setSync('local','Tersimpan di perangkat ini')}
}

}

/* ---------- perhitungan ---------- */
function walletBal(w){var b=w.opening;S.tx.forEach(function(t){
  if(t.type==='in'&&t.wallet===w.id)b+=t.amount;
  else if(t.type==='out'&&t.wallet===w.id)b-=t.amount;
  else if(t.type==='tf'){if(t.wallet===w.id)b-=t.amount;if(t.to===w.id)b+=t.amount}});return b}
function wname(id){var w=S.wallets.filter(function(x){return x.id===id})[0];return w?w.name:'(dompet dihapus)'}
function debtLeft(d){return d.amount-d.pays.reduce(function(a,p){return a+p.amount},0)}
function debtStatus(d){if(debtLeft(d)<=0)return 'lunas';if(d.due&&d.due<todayStr())return 'terlambat';return 'aktif'}
function monthTotals(k){var i=0,o=0;S.tx.forEach(function(t){if(t.date.slice(0,7)!==k||t.debtId)return;if(t.type==='in')i+=t.amount;else if(t.type==='out')o+=t.amount});return {i:i,o:o}}
function rangeTotals(r){var i=0,o=0;S.tx.forEach(function(t){if(t.debtId||t.date<r.s||t.date>r.e)return;if(t.type==='in')i+=t.amount;else if(t.type==='out')o+=t.amount});return {i:i,o:o}}
function spentByCat(k){var m={};S.tx.forEach(function(t){if(t.date.slice(0,7)!==k||t.debtId||t.type!=='out')return;m[t.cat||'Lainnya']=(m[t.cat||'Lainnya']||0)+t.amount});return m}
/* periode anggaran: dimulai tanggal N bulan K, berakhir tanggal N-1 bulan berikutnya (N=1: satu bulan kalender) */
function bStart(){return Math.min(28,Math.max(1,S.budgetStart||1))}
function curBudKey(){var t=todayStr(),f=S.budgetFrom,d0=(+t.slice(0,4)-(+f.slice(0,4)))*12+(+t.slice(5,7)-(+f.slice(5,7))),best=d0,i,r;for(i=d0-3;i<=d0+3;i++){r=budRange(i);if(t>=r.s&&t<=r.e)return i}for(i=d0-3;i<=d0+3;i++){if(budRange(i).s<=t)best=i}return best}
function bEnd(){var e=parseInt(S.budgetEnd,10);return isNaN(e)?0:Math.min(31,Math.max(0,e))}
/* ed=0: otomatis (sehari sebelum tanggal mulai, atau akhir bulan bila mulai tanggal 1); ed 31 = akhir bulan; ed lebih kecil dari sd berarti berakhir di bulan berikutnya */
function rangeFor(k,sd,ed){var p=k.split('-'),y=+p[0],m=+p[1]-1,eff=ed===0?(sd===1?31:sd-1):ed,em=eff<sd?m+1:m,dim=new Date(y,em+1,0).getDate();return {s:ymd(new Date(y,m,sd)),e:ymd(new Date(y,em,Math.min(eff,dim)))}}
function rangeLabel(r){var a=r.s.split('-'),b=r.e.split('-');return parseInt(a[2],10)+' '+BLN[parseInt(a[1],10)-1]+(a[0]!==b[0]?' '+a[0]:'')+' – '+parseInt(b[2],10)+' '+BLN[parseInt(b[1],10)-1]+' '+b[0]}
/* periode dasar = budgetFrom..budgetTo (tanggal lengkap); periode lain digeser per bulan, tanggal akhir bulan tetap akhir bulan */
function isLastDay(ds){var p=ds.split('-');return +p[2]===new Date(+p[0],+p[1],0).getDate()}
function shiftDate(ds,n,keepEnd){var p=ds.split('-'),t=new Date(+p[0],+p[1]-1+n,1),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return ymd(new Date(t.getFullYear(),t.getMonth(),keepEnd?last:Math.min(+p[2],last)))}
function monthFirst(){var d=new Date();return ymd(new Date(d.getFullYear(),d.getMonth(),1))}
function monthLast(){var d=new Date();return ymd(new Date(d.getFullYear(),d.getMonth()+1,0))}
function isFullMonth(r){return r.s.slice(8)==='01'&&r.s.slice(0,7)===r.e.slice(0,7)&&isLastDay(r.e)}
function budRange(n){return {s:shiftDate(S.budgetFrom,n,false),e:shiftDate(S.budgetTo,n,isLastDay(S.budgetTo))}}
function budLabel(k){
  var rr=budRange(k);if(isFullMonth(rr))return monthLabel(rr.s.slice(0,7));
  var r=budRange(k),a=r.s.split('-'),b=r.e.split('-');
  return parseInt(a[2],10)+' '+BLN[parseInt(a[1],10)-1]+(a[0]!==b[0]?' '+a[0]:'')+' – '+parseInt(b[2],10)+' '+BLN[parseInt(b[1],10)-1]+' '+b[0];
}
function spentInRange(r){var m={};S.tx.forEach(function(t){if(t.debtId||t.type!=='out'||t.date<r.s||t.date>r.e)return;m[t.cat||'Lainnya']=(m[t.cat||'Lainnya']||0)+t.amount});return m}
function startOpts(){var o='';for(var i=1;i<=28;i++){o+='<option value="'+i+'"'+(i===bStart()?' selected':'')+'>Tanggal '+i+'</option>'}return o}
function endOpts(){var o='<option value="0"'+(bEnd()===0?' selected':'')+'>Otomatis</option>';for(var i=1;i<=30;i++){o+='<option value="'+i+'"'+(i===bEnd()?' selected':'')+'>Tanggal '+i+'</option>'}return o+'<option value="31"'+(bEnd()===31?' selected':'')+'>Akhir bulan</option>'}
function totals(){var w=0,a=0,c=0,pu=0,pi=0;
  S.wallets.forEach(function(x){w+=walletBal(x)});
  S.assets.forEach(function(x){a+=x.value;c+=x.cost});
  S.debts.forEach(function(d){var l=Math.max(0,debtLeft(d));if(d.dir==='utang')pu+=l;else pi+=l});
  return {wallets:w,assets:a,cost:c,utang:pu,piutang:pi,net:w+a+pi-pu}}

/* ---------- Anggaran ---------- */
/* kalkulator anggaran harian: sisa anggaran dibagi sisa hari periode (hari ini ikut dihitung) */
function calcData(){
  var r=budRange(ui.bm),t0=todayStr(),sp=spentInRange(r),tot=daysBetween(r.s,r.e)+1;
  var left=t0<r.s?tot:(t0>r.e?0:daysBetween(t0,r.e)+1),el=t0<r.s?0:(t0>r.e?tot:daysBetween(r.s,t0)+1);
  var scopes=[],tl=0,ts=0;
  S.cats.out.forEach(function(c){if(S.budgets[c]>0){tl+=S.budgets[c];ts+=sp[c]||0;scopes.push({k:'c:'+c,label:c,lim:S.budgets[c],sp:sp[c]||0})}});
  scopes.unshift({k:'all',label:'Total semua anggaran',lim:tl,sp:ts});
  return {r:r,tot:tot,left:left,el:el,scopes:scopes};
}
function calcScope(d){return d.scopes.filter(function(x){return x.k===ui.calc.scope})[0]||d.scopes[0]}
function calcOut(){
  var d=calcData(),sc=calcScope(d),rem=sc.lim-sc.sp;
  var amt=ui.calc.amt==null?Math.max(0,rem):ui.calc.amt,days=ui.calc.days==null?d.left:ui.calc.days,main;
  if(days<=0)main='<div class="small muted">Isi sisa hari lebih dari 0.'+(d.left===0?' Periode ini sudah berakhir.':'')+'</div>';
  else main='<div class="up">Boleh dipakai per hari</div><div class="num" style="font-size:30px;font-weight:500;color:var(--accent-fg);margin:4px 0 2px;overflow-wrap:anywhere">'+idr(Math.floor(amt/days))+'</div><div class="small muted">'+idr(amt)+' dibagi '+days+' hari</div>';
  var h='<div style="background:var(--accent-soft);border-radius:20px;padding:18px">'+main+'</div>';
  if(rem<0)h+='<p class="small out" style="margin:12px 0 0">Pada "'+esc(sc.label)+'", anggaran sudah terlampaui '+idr(-rem)+'.</p>';
  if(d.el>0&&sc.lim>0){
    var avg=sc.sp/d.el,fc=avg*d.tot,diff=sc.lim-fc;
    h+='<div class="kpis" style="margin-top:16px"><div class="kpi"><span class="up">Pemakaian rata-rata</span><span class="v">'+idr(avg)+'</span><span class="tiny muted">per hari, '+d.el+' hari berjalan</span></div><div class="kpi"><span class="up">Perkiraan total periode</span><span class="v">'+idr(fc)+'</span><span class="tiny muted">jika pola ini berlanjut</span></div></div>'
     +'<p style="margin:12px 0 0"><span class="pill '+(diff>=0?'in':'out')+'">'+(diff>=0?'Aman, perkiraan sisa '+idr(diff):'Berisiko melebihi '+idr(-diff))+'</span></p>';
  }
  return h;
}
function calcRefresh(){var el=$('#calc_out');if(el)el.innerHTML=calcOut()}
function calcCard(){
  if(ui.calc.bm!==ui.bm)ui.calc={scope:ui.calc.scope,amt:null,days:null,bm:ui.bm};
  var d=calcData(),sc=calcScope(d),rem=sc.lim-sc.sp;
  var amt=ui.calc.amt==null?Math.max(0,rem):ui.calc.amt,days=ui.calc.days==null?d.left:ui.calc.days;
  var rows=d.scopes.slice(1).map(function(x){var r2=x.lim-x.sp;return '<div class="item"><div class="l"><span class="t">'+esc(x.label)+'</span><span class="small '+(r2<0?'out':'muted')+'">'+(r2<0?'Melebihi '+idr(-r2):'Sisa '+idr(r2))+'</span></div><div class="r"><span class="num">'+(d.left>0?idr(Math.floor(Math.max(0,r2)/d.left)):'-')+'</span><span class="tiny muted">per hari</span></div></div>'}).join('');

   +'<div class="form"><label class="f">Hitung untuk<select id="calc_scope">'+d.scopes.map(function(x){return '<option value="'+esc(x.k)+'"'+(x.k===sc.k?' selected':'')+'>'+esc(x.label)+'</option>'}).join('')+'</select></label>'

   +'<div id="calc_out" style="margin-top:16px">'+calcOut()+'</div>'

function drawReports(){

/* ---------- ekspor / impor berkas ---------- */
async function saveFile(name,data){
  if(window.claude&&window.claude.use){
    try{var dl=await window.claude.use('downloads');
      if(dl){await dl.save({filename:name,data:data});toast('Berkas disimpan.');return}}
    catch(e){if(e&&e.code==='declined')return}
  }
  try{
    var isCsv=/\.csv$/i.test(name);
    var blob=new Blob([data],{type:isCsv?'text/csv;charset=utf-8':'application/json;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){a.remove();URL.revokeObjectURL(url)},500);
    toast('Berkas diunduh.');
  }catch(e){toast('Berkas tidak dapat diunduh.')}
}
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCsv(){
  var rows=[['Tanggal','Jenis','Kategori','Dompet','Ke dompet','Jumlah','Catatan']];
  S.tx.slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(t){rows.push([t.date,t.type==='in'?'Pemasukan':(t.type==='out'?'Pengeluaran':'Transfer'),t.cat,wname(t.wallet),t.type==='tf'?wname(t.to):'',t.amount,t.note])});
  saveFile('transaksi-'+todayStr()+'.csv','﻿'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\n'));
}
function exportJson(){saveFile('cadangan-buku-kas-'+todayStr()+'.json',JSON.stringify(S,null,2))}

var DRIVE='Google Drive',PREFIX='BukuKas-cadangan';
function driveMsg(e){
  var c=e&&e.code;
  if(c==='server_not_connected')return 'Google Drive belum terhubung. Tambahkan konektor Google Drive di claude.ai, menu Pengaturan lalu Konektor.';
  if(c==='needs_reauth')return 'Sambungan Google Drive sudah kedaluwarsa. Hubungkan ulang di claude.ai, menu Pengaturan lalu Konektor.';
  if(c==='not_in_manifest'||c==='consent_required')return 'Halaman ini belum diizinkan memakai Google Drive. Buka menu Permissions halaman ini, izinkan Google Drive, lalu coba lagi.';
  if(c==='approval_required')return 'Perlu izin Anda. Tekan tombolnya lagi lalu pilih Izinkan.';
  if(c==='selection_required')return 'Pilih akun Google Drive yang akan dipakai, lalu coba lagi.';
  if(c==='blocked_by_policy')return 'Organisasi Anda memblokir akses Google Drive.';
  if(c==='server_unavailable'||c==='upstream_error')return 'Google Drive sedang tidak dapat dijangkau. Coba lagi sebentar lagi.';
  if(c==='tool_error')return 'Google Drive menolak permintaan ini'+(e.message?': '+String(e.message).slice(0,140):'.');
  if(c==='no_mcp')return 'Fitur Google Drive hanya tersedia saat halaman ini dibuka di claude.ai.';
  if(c==='format')return e.message;
  return 'Gagal menghubungi Google Drive. Coba lagi.';
}
async function driveGate(){
  var cl=window.claude;if(!cl||!cl.use)throw {code:'no_mcp'};
  var mcp=await cl.use('mcp');if(!mcp)throw {code:'no_mcp'};
  try{var perm=await cl.use('permissions');if(perm&&perm.request){var st=await perm.request(['mcp:'+DRIVE]);if(st&&st['mcp:'+DRIVE]==='denied')throw {code:'not_in_manifest'}}}
  catch(e){if(e&&e.code==='not_in_manifest')throw e}
  return mcp;
}
async function schemaKeys(mcp,tool){try{var d=await mcp.describeTool(DRIVE,tool);var pr=(d&&d.inputSchema&&d.inputSchema.properties)||null;return pr?Object.keys(pr):null}catch(e){return null}}
function pickKey(keys,cands){if(!keys)return cands[0];for(var i=0;i<cands.length;i++)if(keys.indexOf(cands[i])>=0)return cands[i];return null}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
function fromB64(s){return decodeURIComponent(escape(atob(s)))}
function stampName(){var d=new Date();return PREFIX+'-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+'.json'}

async function driveBackup(){
  try{
    var cfg=getGDriveConfig();
    if(!cfg){
      toast('Google Drive belum dikonfigurasi. Buka Pengaturan > Cadangan & pemulihan.');
      return;
    }
    toast('Mencadangkan ke Google Drive…');
    var name=stampName(),json=JSON.stringify(S);
    await gdriveCreateBackup(json,name);
    S.driveLast={at:Date.now(),name:name};save();render();
    toast('Cadangan tersimpan di Google Drive: '+name);
  }catch(e){toast(gdriveErrorMsg(e))}
}
function gdriveErrorMsg(e){
  var c=e&&e.code;
  if(c==='no_config')return 'Google Drive belum dikonfigurasi. Buka Pengaturan > Cadangan & pemulihan > Konfigurasi Google Drive.';
  if(c===401||c==='auth_failed')return 'Sesi Google Drive kedaluwarsa. Silakan hubungkan ulang di Pengaturan.';
  if(c===403)return 'Akses ditolak. Periksa izin OAuth (scope drive.appdata) dan pastikan API Drive diaktifkan di Google Cloud Console.';
  if(c===404)return 'File tidak ditemukan.';
  if(c==='format')return e.message;
  return 'Gagal mencadangkan ke Google Drive: '+(e.message||e);
}
function findArray(p){
  if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){return []}}
  if(Array.isArray(p))return p;
  if(p&&typeof p==='object'){var ks=['files','items','results','data','matches'];for(var i=0;i<ks.length;i++)if(Array.isArray(p[ks[i]]))return p[ks[i]]}
  return [];
}
async function driveList(mcp){
  var keys=await schemaKeys(mcp,'search_files'),qk=pickKey(keys,['query','q','searchQuery','search'])||'query';
  var tries=["title contains '"+PREFIX+"'","name contains '"+PREFIX+"'",PREFIX],lastErr=null;
  for(var i=0;i<tries.length;i++){
    try{
      var inp={};inp[qk]=tries[i];
      var r=await mcp.callTool(DRIVE,'search_files',inp,{cache:false});
      var files=findArray(r.payload).map(function(x){return {id:x.id||x.fileId||'',name:x.title||x.name||'',at:x.modifiedTime||x.modifiedDate||x.lastModifiedTime||x.createdTime||x.modified||''}})
        .filter(function(x){return x.id&&x.name.indexOf(PREFIX)>=0});
      if(files.length)return files.sort(function(a,b){return String(b.at)<String(a.at)?-1:1});
    }catch(e){
      lastErr=e;var c=e&&e.code;
      if(c==='needs_reauth'||c==='server_not_connected'||c==='not_in_manifest'||c==='approval_required'||c==='selection_required'||c==='blocked_by_policy')throw e;
    }
  }
  if(lastErr&&!(lastErr.code==='tool_error'))throw lastErr;
  return [];
}
function textOf(r){
  var p=r&&r.payload;
  if(typeof p==='string')return p;
  if(p&&typeof p==='object'){var ks=['content','text','body','data'];for(var i=0;i<ks.length;i++)if(typeof p[ks[i]]==='string')return p[ks[i]]}
  var t=(r&&r.content||[]).filter(function(b){return b&&b.type==='text'}).map(function(b){return b.text}).join('\n');
  return t;
}
function parseBackup(txt){
  var o=null;
  try{o=JSON.parse(txt)}catch(e){
    var a=txt.indexOf('{'),b=txt.lastIndexOf('}');
    if(a>=0&&b>a){try{o=JSON.parse(txt.slice(a,b+1))}catch(e2){}}
    if(!o){try{o=JSON.parse(fromB64(txt.replace(/\s/g,'')))}catch(e3){}}
  }
  if(o&&o.content&&typeof o.content==='string'&&!o.wallets){try{return parseBackup(o.content)}catch(e4){}}
  if(!o||!Array.isArray(o.wallets)||!Array.isArray(o.tx))throw {code:'format',message:'Berkas ini bukan cadangan Buku Kas yang valid.'};
  return o;
}
async function driveReadFile(mcp,id){
  var tools=['download_file_content','read_file_content'],err=null;
  for(var i=0;i<tools.length;i++){
    try{
      var keys=await schemaKeys(mcp,tools[i]),ik=pickKey(keys,['fileId','file_id','id']);
      if(!ik)continue;var inp={};inp[ik]=id;
      var r=await mcp.callTool(DRIVE,tools[i],inp,{cache:false});
      return parseBackup(textOf(r));
    }catch(e){err=e;if(e&&(e.code==='needs_reauth'||e.code==='not_in_manifest'||e.code==='server_not_connected'))throw e}
  }
  throw err||{code:'format',message:'Isi cadangan tidak dapat dibaca.'};
}
async function driveRestoreOpen(){
  openModal({title:'Pulihkan dari Google Drive',hideSubmit:true,cancel:'Tutup',body:'<div id="drivelist" class="small muted">Mencari cadangan…</div>'});
  try{
    var cfg=getGDriveConfig();
    if(!cfg){
      var box=$('#drivelist');box.className='err';box.textContent='Google Drive belum dikonfigurasi. Buka Pengaturan > Cadangan & pemulihan.';
      return;
    }
    var files=await gdriveListBackups(),box=$('#drivelist');if(!box)return;
    box.className='';
    box.innerHTML=files.length?'<div class="list">'+files.slice(0,15).map(function(f){return '<div class="item"><div class="l"><span class="t" style="font-size:14px">'+esc(f.name)+'</span><span class="tiny muted">'+(fmtStamp(f.modifiedTime)||'Tanggal tidak diketahui')+'</span></div><button type="button" class="btn sm primary" data-act="drive-pick" data-id="'+esc(f.id)+'">Pulihkan</button></div>'}).join('')+'</div>'
      :'<div class="empty">Tidak ada cadangan Buku Kas di Google Drive Anda. Buat cadangan dulu dengan tombol Cadangkan ke Google Drive.</div>';
  }catch(e){var b=$('#drivelist');if(b){b.className='err';b.textContent=gdriveErrorMsg(e)}}
}
async function drivePick(id){
  var box=$('#drivelist');if(box){box.className='small muted';box.textContent='Mengunduh cadangan…'}
  try{
    var txt=await gdriveReadBackup(id),o=parseBackup(txt);
    var n=(o.tx||[]).length,when=o.updatedAt?' (terakhir diubah '+fmtStamp(o.updatedAt)+')':'';
    confirmBox('Pulihkan cadangan berisi '+n+' transaksi, '+(o.wallets||[]).length+' dompet, '+(o.debts||[]).length+' catatan utang/piutang, dan '+(o.assets||[]).length+' aset'+when+'? Data yang ada sekarang akan diganti.',function(){
      var keep=S.prefs,last=S.driveLast;S=normalize(o);S.demo=false;S.prefs=keep;S.driveLast=last;afterChange('Data dipulihkan dari Google Drive.');
    },'Pulihkan');
  }catch(e){var b=$('#drivelist');if(b){b.className='err';b.textContent=gdriveErrorMsg(e)}else toast(gdriveErrorMsg(e))}
}

/* ---------- aksi ---------- */
function byId(list,id){return list.filter(function(x){return x.id===id})[0]}
function freshState(){var keep=S.prefs,last=S.driveLast;S=emptyState();S.prefs=keep;S.driveLast=last;ui.bm=curBudKey()}
function onAct(el){
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id'),id2=el.getAttribute('data-id2'),val=el.getAttribute('data-val');
  if(a==='tab'){closeModal();ui.tab=val;try{history.replaceState(null,'','#'+val)}catch(e){}render();window.scrollTo(0,0)}
  else if(a==='menu')menuSheet();
  else if(a==='month-prev'||a==='month-next'){ui.month=addMonths(ui.month,a==='month-prev'?-1:1);render()}
  else if(a==='bm-prev'||a==='bm-next'){ui.bm+=(a==='bm-prev'?-1:1);render()}
  else if(a==='calc-reset'){ui.calc={scope:'all',amt:null,days:null,bm:ui.bm};render()}
  else if(a==='rbm-now'){ui.bm=curBudKey();render()}
  else if(a==='close')closeModal();
  else if(a==='set-mode'){S.prefs.mode=val;applyTheme();save();render()}
  else if(a==='set-accent'){S.prefs.accent=val;applyTheme();save();render()}
  else if(a==='add-tx')txForm();
  else if(a==='quick-tx')txForm(null,val);
  else if(a==='edit-tx')txForm(byId(S.tx,id));
  else if(a==='del-tx')confirmBox('Hapus transaksi ini? Saldo dompet akan dihitung ulang.',function(){S.tx=S.tx.filter(function(t){return t.id!==id});afterChange('Transaksi dihapus.')});
  else if(a==='add-wallet')walletForm();
  else if(a==='edit-wallet')walletForm(byId(S.wallets,id));
  else if(a==='del-wallet'){
    var used=S.tx.some(function(t){return t.wallet===id||t.to===id})||S.debts.some(function(d){return d.wallet===id});
    if(S.wallets.length<=1){toast('Minimal harus ada satu dompet.');return}
    if(used){toast('Dompet ini sudah dipakai transaksi. Hapus atau pindahkan transaksinya dulu.');return}
    confirmBox('Hapus dompet ini?',function(){S.wallets=S.wallets.filter(function(w){return w.id!==id});afterChange('Dompet dihapus.')});
  }
  else if(a==='add-debt')debtForm();
  else if(a==='edit-debt')debtForm(byId(S.debts,id));
  else if(a==='pay-debt')payForm(byId(S.debts,id));
  else if(a==='toggle-debt'){ui.openDebt[id]=!ui.openDebt[id];render()}
  else if(a==='dfilter'){ui.dfilter=val;render()}
  else if(a==='del-pay'){var d=byId(S.debts,id);confirmBox('Hapus pembayaran ini? Transaksi terkait di dompet ikut dihapus.',function(){var p=byId(d.pays,id2);S.tx=S.tx.filter(function(t){return t.id!==p.txId});d.pays=d.pays.filter(function(x){return x.id!==id2});afterChange('Pembayaran dihapus.')})}
  else if(a==='del-debt')confirmBox('Hapus catatan ini beserta seluruh transaksi terkait di dompet?',function(){S.tx=S.tx.filter(function(t){return t.debtId!==id});S.debts=S.debts.filter(function(d){return d.id!==id});afterChange('Catatan dihapus.')});
  else if(a==='add-asset')assetForm();
  else if(a==='edit-asset')assetForm(byId(S.assets,id));
  else if(a==='asset-value')assetValueForm(byId(S.assets,id));
  else if(a==='toggle-asset'){ui.openAsset[id]=!ui.openAsset[id];render()}
  else if(a==='del-asset')confirmBox('Hapus aset ini?',function(){S.assets=S.assets.filter(function(x){return x.id!==id});afterChange('Aset dihapus.')});
  else if(a==='edit-budget')budgetForm();
  else if(a==='del-cat'){var list=S.cats[val];if(list.length<=1){toast('Sisakan minimal satu kategori.');return}S.cats[val]=list.filter(function(c){return c!==id});if(val==='out')delete S.budgets[id];afterChange('Kategori dihapus.')}
  else if(a==='export-csv')exportCsv();
  else if(a==='export-json')exportJson();
  else if(a==='import-json')$('#importfile').click();
  else if(a==='gdrive-connect'){
    var clientIdEl=document.querySelector('input[name="gdrive_client_id"]');
    var apiKeyEl=document.querySelector('input[name="gdrive_api_key"]');
    var clientId=clientIdEl?.value?.trim();
    var apiKey=apiKeyEl?.value?.trim();
    if(!clientId){toast('Isi Client ID terlebih dahulu.');return}
    if(!clientId.includes('.apps.googleusercontent.com')){toast('Client ID tidak valid (harus berakhiran .apps.googleusercontent.com).');return}
    saveGDriveConfig({clientId:clientId,apiKey:apiKey||''});
    gdriveGetToken(false).then(function(){toast('Google Drive terhubung!');render()}).catch(function(e){toast('Gagal terhubung: '+(e.message||e));clearGDriveConfig();render()});
  }
  else if(a==='gdrive-disconnect'){
    confirmBox('Putuskan koneksi Google Drive?',function(){clearGDriveConfig();toast('Google Drive diputuskan.');render()});
  }
  else if(a==='sb-save-config'){
    var uEl=document.querySelector('input[name="sb_url"]'),kEl=document.querySelector('input[name="sb_key"]');
    var sbUrl=uEl?uEl.value.trim():'',sbKey=kEl?kEl.value.trim():'';
    if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(sbUrl)){toast('Project URL harus seperti https://xxxx.supabase.co');return}
    if(sbKey.length<40){toast('Anon key tidak valid.');return}
    saveSbConfig({url:sbUrl.replace(/\/+$/,''),key:sbKey});
    sbClient=null;sbUser=null;sbUnsubscribe();
    toast('Konfigurasi Supabase disimpan.');render();sbStart();
  }
  else if(a==='sb-login'||a==='sb-signup'){
    var eEl=document.querySelector('input[name="sb_email"]'),pEl=document.querySelector('input[name="sb_pass"]');
    var sbEmail=eEl?eEl.value.trim():'',sbPass=pEl?pEl.value:'';
    if(!sbEmail||!sbPass){toast('Isi email dan kata sandi.');return}
    toast(a==='sb-login'?'Masuk\u2026':'Mendaftar\u2026');
    var sbAction=a==='sb-login'?sbLogin(sbEmail,sbPass):sbSignUp(sbEmail,sbPass);
    sbAction.then(function(msg){toast(msg||'Berhasil masuk. Data disinkronkan.');render()}).catch(function(e){toast(sbErrorMsg(e));render()});
  }
  else if(a==='sb-logout')sbLogout();
  else if(a==='sb-sync-now')sbManualSync();
  else if(a==='sb-disconnect'){
    confirmBox('Ganti project Supabase? Konfigurasi saat ini akan dihapus dari perangkat ini.',function(){clearSbConfig();sbUser=null;sbUnsubscribe();sbClient=null;sbSetStatus('local','Tersimpan di perangkat ini');render()},'Ganti project');
  }
  else if(a==='drive-backup')driveBackup();
  else if(a==='drive-restore')driveRestoreOpen();
  else if(a==='drive-pick')drivePick(id);
  else if(a==='clear-demo')confirmBox('Hapus semua data contoh dan mulai dari kosong?',function(){freshState();afterChange('Data contoh dihapus. Silakan mulai mencatat.')},'Mulai dari kosong');
  else if(a==='reset-all')confirmBox('Hapus semua dompet, transaksi, utang, dan aset? Tindakan ini tidak bisa dibatalkan.',function(){freshState();ui.f={q:'',type:'',wallet:'',cat:''};afterChange('Semua data dihapus.')},'Hapus semua');
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(el){onAct(el);return}
  if(e.target.id==='modal')closeModal();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
document.addEventListener('submit',function(e){
  var f=e.target;if(f.getAttribute('data-form')!=='addcat')return;
  e.preventDefault();var type=f.getAttribute('data-type'),n=String(f.elements.n.value).trim();
  if(!n)return;if(S.cats[type].indexOf(n)>=0){toast('Kategori sudah ada.');return}
  S.cats[type].push(n);afterChange('Kategori ditambahkan.');
});
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='f_q'){ui.f.q=e.target.value;renderTxList()}
  else if(id==='calc_amt'){var v=parseMoney(e.target.value);e.target.value=moneyStr(v);ui.calc.amt=v;calcRefresh()}
  else if(id==='calc_days'){var dv=e.target.value===''?0:parseInt(e.target.value,10);ui.calc.days=isNaN(dv)?0:Math.max(0,Math.min(366,dv));calcRefresh()}
});
document.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='f_type'){ui.f.type=e.target.value;renderTxList()}
  else if(id==='f_wallet'){ui.f.wallet=e.target.value;renderTxList()}
  else if(id==='f_cat'){ui.f.cat=e.target.value;renderTxList()}
  else if(id==='calc_scope'){ui.calc.scope=e.target.value;ui.calc.amt=null;render()}
  else if(id==='importfile'){
    var file=e.target.files&&e.target.files[0];if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o||!Array.isArray(o.wallets)||!Array.isArray(o.tx))throw new Error('x');
      confirmBox('Pulihkan cadangan ini? Data saat ini akan diganti.',function(){var keep=S.prefs,last=S.driveLast;S=normalize(o);S.demo=false;S.prefs=keep;S.driveLast=last;afterChange('Data dipulihkan dari cadangan.')},'Pulihkan')}
      catch(err){toast('Berkas cadangan tidak valid.')}};
    rd.readAsText(file);e.target.value='';
  }
});

/* ---------- mulai ---------- */
(function boot(){
  var h='';try{h=(location.hash||'').slice(1)}catch(e){}
  if(NAV.some(function(t){return t[0]===h}))ui.tab=h;
  S=readLocal()||demoState();ui.bm=curBudKey();
  applyTheme();watchTheme();
  render();
  setSync('local','Menyambungkan…');
  initDb();
  sbStart();
})();
})();
